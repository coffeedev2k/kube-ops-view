[package]
name = "kube-ops-view"
version = "2026.0.0-dev.1"
description = "Kubernetes Operational View - read-only system dashboard for multiple K8s clusters"
authors = [
    "Henning Jacobs <henning@jacobs1.de>",
    "Thomas Pham <thomas.pham@ithings.ch>",
]
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-signed"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
http = "1"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4", default-features = false, features = ["client", "rustls-tls", "ring"] }
rand = "0.9"
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio", "connection-manager", "script"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
